
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS AI Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>◉ JARVIS</h1>
        <p>AI COMMAND SYSTEM</p>
        <div id="connection">● SYSTEM OFFLINE</div>
    </header>

    <main>

        <section class="assistant">
            <div class="core">JARVIS</div>

            <h2>YOUR PERSONAL AI ASSISTANT</h2>

            <p id="status">System Ready</p>

            <button id="micButton">
                🎙 TALK TO JARVIS
            </button>
        </section>

        <section class="console">

            <h3>COMMAND CONSOLE</h3>

            <div id="userCommand">
                Your commands will appear here...
            </div>

            <div id="jarvisResponse">
                JARVIS responses will appear here...
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
